[project]
name = "eldenct"
version = "0.1.0"
description = "ELDEN RING 特化 Cheat Table (CT) 翻译工具：词条提取、xlsx 导出/导回、术语表优先精准替换、结构保护、乱序 diff 对照"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "xlsxwriter>=3.2",
    "openpyxl>=3.1",
    "pyahocorasick>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eldenct"]
